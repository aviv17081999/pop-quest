name: Build Pop Quest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the test APK under Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Build test APK (install this on your phone)
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key in repository secrets yet, so only the test APK is built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Play Store bundle (.aab) and signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PopQuest-test-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish test APK as a direct download (Releases > Test build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PopQuest-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build PopQuest-test.apk --prerelease --title "Pop Quest test build" \
            --notes "Test build from ${GITHUB_SHA::7}. Download PopQuest-test.apk on your Android phone and open it to install. Shows Google's test ads."

      - name: Upload Play Store bundle
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PopQuest-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
